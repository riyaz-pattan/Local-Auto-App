name: rider
description: "Local Auto - Find nearby autos"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  firebase_database: ^11.3.5
  cloud_firestore: ^5.6.7
  google_maps_flutter: ^2.10.0
  url_launcher: ^6.3.2
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  geohash_plus: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/map_icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/icon_main.png"
  adaptive_icon_background: "assets/images/logo/icon_background.png"
  adaptive_icon_foreground: "assets/images/logo/icon_foreground.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo/splash_640.png"
  android_12:
    image: "assets/images/logo/splash_1152.png"
    icon_background_color: "#ffffff"
