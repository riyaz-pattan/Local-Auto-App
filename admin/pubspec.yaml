name: admin
description: "Local Auto Admin Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_database: ^11.3.5
  firebase_storage: ^12.4.5
  google_maps_flutter: ^2.10.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  firebase_auth: ^5.7.0
  cloud_functions: ^5.6.2
  image_picker: ^1.2.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/icon_main.jpg"
  adaptive_icon_background: "assets/images/logo/icon_background.png"
  adaptive_icon_foreground: "assets/images/logo/icon_foreground.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo/splash_640.jpg"
  android_12:
    image: "assets/images/logo/splash_1152.jpg"
    icon_background_color: "#ffffff"
