name: driver
description: "Local Auto Driver App"
publish_to: 'none'
version: 1.0.1+7

environment:
  sdk: ^3.9.2

dependencies:
  uuid: ^4.5.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  firebase_database: ^11.3.5
  firebase_storage: ^12.4.5
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  flutter_foreground_task: ^8.16.0
  intl: ^0.20.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  geohash_plus: ^1.1.1
  google_sign_in: ^6.2.1
  location: ^10.0.2
  firebase_messaging: ^15.2.10
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/icon_main.png"
  adaptive_icon_background: "assets/images/logo/icon_background.png"
  adaptive_icon_foreground: "assets/images/logo/icon_foreground.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo/splash_640.png"
  android_12:
    image: "assets/images/logo/splash_1152.png"
    icon_background_color: "#ffffff"
